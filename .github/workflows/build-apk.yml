name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Gradle project
        id: proj
        run: |
          echo "== Repo files =="
          find . -not -path './.git/*' -type f | head -n 80
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            z=$(find . -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$z" ]; then
              echo "No project found, extracting $z"
              mkdir -p _unzipped
              unzip -q -o "$z" -d _unzipped
              f=$(find _unzipped -name settings.gradle.kts | head -n 1)
            fi
          fi
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found. Upload the project files (app/, build.gradle.kts, settings.gradle.kts ...) to the repository."
            exit 1
          fi
          d=$(dirname "$f")
          echo "Project dir: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GlassDialer-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
